name: Build (full)

# Full solution build INCLUDING the game-touching Shim + mod. Compiles against metadata-only,
# method-body-stripped reference assemblies (NStrip ThrowNull — generated from a licensed Derail
# Valley install by tools/refs-export, UMM + Harmony included) held in the PRIVATE
# DSMedia-gg/dv-gamerefs repo, checked out at the tag pinned in .ci/gamerefs.json. See 05 §4, D26.
# No Steam account is involved: anonymous depot access is unavailable for DV (verified 2026-08-08)
# and full game binaries never leave the licensed install.
#
# Requires: secret GAMEREFS_TOKEN (fine-grained PAT, read-only Contents on dv-gamerefs only)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-build:
    name: refs stash + full build + API-compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Read pinned game-refs tag
        id: pin
        run: echo "ref=$(jq -r '.ref' .ci/gamerefs.json)" >> "$GITHUB_OUTPUT"

      - name: Fetch reference assemblies (private stash, D26)
        # Metadata-only NStrip'd assemblies incl. the UnityModManager subfolder (UMM + Harmony) —
        # ~27 MB, so no cache layer needed. Reference/compile use only; never packaged.
        uses: actions/checkout@v4
        with:
          repository: DSMedia-gg/dv-gamerefs
          ref: ${{ steps.pin.outputs.ref }}
          token: ${{ secrets.GAMEREFS_TOKEN }}
          path: game

      - name: Point the build at the reference assemblies
        run: |
          cat > Directory.Build.targets <<'EOF'
          <Project>
            <PropertyGroup>
              <DvManaged>$(MSBuildThisFileDirectory)game/DerailValley_Data/Managed</DvManaged>
              <DvUmm>$(DvManaged)/UnityModManager</DvUmm>
            </PropertyGroup>
            <ItemGroup Condition="'$(LocoMpGameProject)' == 'true'">
              <Reference Include="UnityModManager"><HintPath>$(DvUmm)/UnityModManager.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="0Harmony"><HintPath>$(DvUmm)/0Harmony.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="Assembly-CSharp"><HintPath>$(DvManaged)/Assembly-CSharp.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="UnityEngine"><HintPath>$(DvManaged)/UnityEngine.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="UnityEngine.CoreModule"><HintPath>$(DvManaged)/UnityEngine.CoreModule.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="DV.Simulation"><HintPath>$(DvManaged)/DV.Simulation.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="DV.Common"><HintPath>$(DvManaged)/DV.Common.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="DV.RailTrack"><HintPath>$(DvManaged)/DV.RailTrack.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="DV.Utils"><HintPath>$(DvManaged)/DV.Utils.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="BezierCurves"><HintPath>$(DvManaged)/BezierCurves.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="DV.PointSet"><HintPath>$(DvManaged)/DV.PointSet.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="net.smkd.vector3d"><HintPath>$(DvManaged)/net.smkd.vector3d.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="DV.Inventory"><HintPath>$(DvManaged)/DV.Inventory.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="DV.ThingTypes"><HintPath>$(DvManaged)/DV.ThingTypes.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="DV.OriginShiftInfo"><HintPath>$(DvManaged)/DV.OriginShiftInfo.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="UnityEngine.PhysicsModule"><HintPath>$(DvManaged)/UnityEngine.PhysicsModule.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="UnityEngine.TextRenderingModule"><HintPath>$(DvManaged)/UnityEngine.TextRenderingModule.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="UnityEngine.IMGUIModule"><HintPath>$(DvManaged)/UnityEngine.IMGUIModule.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="UnityEngine.UIModule"><HintPath>$(DvManaged)/UnityEngine.UIModule.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="UnityEngine.UI"><HintPath>$(DvManaged)/UnityEngine.UI.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="Unity.TextMeshPro"><HintPath>$(DvManaged)/Unity.TextMeshPro.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="UnityEngine.InputLegacyModule"><HintPath>$(DvManaged)/UnityEngine.InputLegacyModule.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="DV.UI"><HintPath>$(DvManaged)/DV.UI.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="DV.UIFramework"><HintPath>$(DvManaged)/DV.UIFramework.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="DV.Interaction"><HintPath>$(DvManaged)/DV.Interaction.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="DV.WeatherSystem"><HintPath>$(DvManaged)/DV.WeatherSystem.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="DV.BrakeSystem"><HintPath>$(DvManaged)/DV.BrakeSystem.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="Facepunch.Steamworks.Win64"><HintPath>$(DvManaged)/Facepunch.Steamworks.Win64.dll</HintPath><Private>false</Private></Reference>
            </ItemGroup>
          </Project>
          EOF

      - name: Build full solution (incl. Shim + mod)
        run: dotnet build LocoMP.sln -c Release

      - name: API-compat check (B100 early-warning)
        run: |
          # TODO (05 §4, WalkerSim2 model): diff the game-facing member list the Shim depends on against
          # the freshly downloaded assemblies; fail naming exactly which members changed. Lands with the
          # Shim's real patch targets (post-M0). For now the full build above is the compat smoke test.
          echo "API-compat check: placeholder — see 05 §4."
