# LocoMP dedicated server.
#
# This is a RAW-UDP game server, so it is NOT fronted by a reverse proxy or CDN (neither proxies
# arbitrary game UDP). It needs a direct UDP port plus a router port-forward, exactly like any other
# self-hosted game server.
#
#   docker compose -f docker/compose.yml up -d --build     # build + start
#   docker compose -f docker/compose.yml logs -f           # follow the [soak] health line
#   docker compose -f docker/compose.yml down              # SIGTERM → graceful world save
#
# The world save (and any real world/career you mount) live in ./data next to this file.
services:
  locomp:
    build:
      context: ..                 # repo root - the Dockerfile needs src/ + build props + tests/data
      dockerfile: docker/Dockerfile
    image: locomp-server:dev
    container_name: locomp-server
    restart: unless-stopped
    stop_grace_period: 20s        # give the SIGTERM save time to flush before Docker hard-kills
    ports:
      - "25701:25701/udp"
    volumes:
      - ./data:/data
    # The baked CMD runs a BARE server (presence + job board + persistence) with a health line every
    # 5 min - no topology needed. Uncomment to add server-owned trains (mount a real extracted world.lmpw
    # in ./data) and/or a real career (career.lmpc). Args are space-separated tokens - "--flag" then value:
    # command: ["--port", "25701", "--save", "/data/locomp-server.save", "--config", "/data/career.lmpc", "--world", "/data/world.lmpw", "--spawn-trains", "3", "--soak-report", "300"]
